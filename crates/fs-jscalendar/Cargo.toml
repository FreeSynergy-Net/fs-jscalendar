[package]
name = "fs-jscalendar"
description = "Shared types of the JSCalendar 2.0 standard for FreeSynergy: time, zones, recurrence rule, participants, upgrade, shared validation, iCalendar conversion. A plain library: no data, no storage, no program"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Last MIT/Apache version before Stalwart moved later releases to AGPL: pinned exactly (see DESIGN.md).
calcard = "=0.3.14"
# Zones: jiff (Unlicense OR MIT) with the system tzdb preferred and a bundled copy as fallback (ADR 0026).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
jiff-tzdb = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
# PROVISIONAL (blocker for main): path dependency on the unmerged branch unreviewed/fs-types-gemeinsam of fs-interfaces
# (shared types Utc, LocalDateTime, Reference ...). After the merge and the tag of fs-interfaces this line becomes
# fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.NN" } like the other pins.
fs-types = { path = "../../../fs-types-gemeinsam/crates/fs-types" }
