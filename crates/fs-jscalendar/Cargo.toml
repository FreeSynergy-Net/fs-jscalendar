[package]
name = "fs-jscalendar"
description = "Shared types of the JSCalendar 2.0 standard for FreeSynergy: time, zones, recurrence rule, participants, upgrade, shared validation, iCalendar conversion. A plain library: no data, no storage, no program"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Maintained fork of calcard 0.3.14 (Apache-2.0 OR MIT), pinned exactly; only the adapter modules name it (see DESIGN.md).
calcard-next = "=3.0.1"
# Zones: jiff (Unlicense OR MIT) with the system tzdb preferred and a bundled copy as fallback (ADR 0026).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
jiff-tzdb = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
# The shared basic types (Utc, LocalDateTime, Reference ...): pinned like the other FreeSynergy crates; the same tag as calendar and tasks.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6" }
